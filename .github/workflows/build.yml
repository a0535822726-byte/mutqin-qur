name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mutqin-apk-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sources
        id: check
        run: |
          if [ -f src/Data.kt ] && [ -f src/MainActivity.kt ] && [ -f src/ListScreen.kt ] && [ -f src/ReaderScreens.kt ] && [ -f src/RecorderScreen.kt ] && [ -f src/TajweedScreen.kt ] && [ -f src/StoriesScreen.kt ] && [ -f src/RecitationCheckScreen.kt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ملفات الشيفرة لم تكتمل بعد، لا يوجد بناء الآن"
          fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.ready == 'true'
        with:
          gradle-version: '8.9'
      - name: Create project
        if: steps.check.outputs.ready == 'true'
        run: |
          D=Mutqin/app/src/main
          mkdir -p $D/java/com/mutqin/app $D/res/values $D/res/drawable $D/assets
          cp src/*.kt $D/java/com/mutqin/app/
          cd Mutqin
          cat > settings.gradle.kts <<'EOT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Mutqin"
          include(":app")
          EOT
          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOT
          cat > gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOT
          cat > app/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.mutqin.app"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.mutqin.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 5
                  versionName = "0.5.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="مُتقن"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Mutqin">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT
          cat > app/src/main/res/values/themes.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Mutqin" parent="android:Theme.DeviceDefault.NoActionBar" />
          </resources>
          EOT
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path android:fillColor="#0F5132" android:pathData="M0,0h96v96h-96z" />
              <path android:fillColor="#D4AF37" android:pathData="M48,18 L56,40 L78,48 L56,56 L48,78 L40,56 L18,48 L40,40 Z" />
              <path android:fillColor="#0F5132" android:pathData="M48,38 a10,10 0 1,0 0.01,0 Z" />
          </vector>
          EOT
      - name: Download Quran text
        if: steps.check.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import json, urllib.request, time, sys
          url = "https://api.alquran.cloud/v1/quran/quran-uthmani"
          data = None
          for attempt in range(4):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = json.load(urllib.request.urlopen(req, timeout=120))
                  break
              except Exception as e:
                  print("محاولة", attempt + 1, "فشلت:", e)
                  time.sleep(5)
          if data is None:
              sys.exit("تعذر تحميل نص القرآن من alquran.cloud")
          surahs = data["data"]["surahs"]
          lines = []
          counts = []
          for s in surahs:
              n = s["number"]
              counts.append(len(s["ayahs"]))
              for k, a in enumerate(s["ayahs"], start=1):
                  t = a["text"].strip()
                  if a["numberInSurah"] != k:
                      sys.exit("ترتيب الآيات غير متوقع في سورة %d" % n)
                  lines.append("%d|%d|%s" % (n, k, t))
          if len(surahs) != 114 or len(lines) != 6236:
              sys.exit("عدد السور أو الآيات غير صحيح: %d / %d" % (len(surahs), len(lines)))
          if counts[0] != 7 or counts[1] != 286 or counts[8] != 129 or counts[113] != 6:
              sys.exit("أعداد الآيات لا تطابق المتوقع")
          with open("Mutqin/app/src/main/assets/quran.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print("تم: 114 سورة و 6236 آية")
          print(lines[0])
          print(lines[7])
          PY
      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: |
          cd Mutqin
          gradle assembleDebug --no-daemon
      - name: Publish
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Mutqin/app/build/outputs/apk/debug/app-debug.apk --clobber
            gh release edit latest --title "مُتقن" --notes "أحدث نسخة مبنية آليًا"
          else
            gh release create latest Mutqin/app/build/outputs/apk/debug/app-debug.apk --title "مُتقن" --notes "أحدث نسخة مبنية آليًا"
          fi
